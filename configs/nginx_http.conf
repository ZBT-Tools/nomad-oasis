# Nginx configuration for handling HTTP requests

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    zone nomad_app_backend 64k;
    resolver 127.0.0.11 valid=5s;
    server app:8000 resolve;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen        1080;
    server_name   172.16.134.7 localhost;
    proxy_set_header Host $host;

    # Reuse upstream keep-alive connections
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    include conf.d/nginx_base_conf;
}
