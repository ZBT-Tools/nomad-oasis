# ---------------------------------------------------------------------------
# Common Configuration & YAML Anchors
# ---------------------------------------------------------------------------

# Reusable image definitions with environment variable overrides
x-images:
  nomad:      &nomad-image      ${APP_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template:${IMAGE_TAG:-main}}
  jupyter:    &jupyter-image    ${JUPYTER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/jupyter:${IMAGE_TAG:-main}}
  cpu-worker: &cpu-worker-image ${NOMAD_CPU_WORKER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/cpu-action:${IMAGE_TAG:-main}}
  gpu-worker: &gpu-worker-image ${NOMAD_GPU_WORKER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/gpu-action:${IMAGE_TAG:-main}}
  north:      &north-image      ${NOMAD_NORTH_IMAGE:-ghcr.io/fairmat-nfdi/nomad-north:v2.0.0rc1}

  temporal-admin:  &temporal-admin-image  docker.io/temporalio/admin-tools:${TEMPORAL_VERSION:-1.31}
  temporal-server: &temporal-server-image docker.io/temporalio/server:${TEMPORAL_VERSION:-1.31}

# Common environment variables shared across NOMAD app and internal/cpu/gpu workers
x-nomad-environment: &nomad-environment
  NOMAD_ELASTIC_HOST: ${NOMAD_ELASTIC_HOST:-elastic}
  NOMAD_ELASTIC_VERSION: ${NOMAD_ELASTIC_VERSION:-9}
  NOMAD_MONGO_HOST: ${NOMAD_MONGO_HOST:-mongo}
  NOMAD_TEMPORAL_HOST: ${NOMAD_TEMPORAL_HOST:-temporal}

# Base configuration shared across NOMAD app and internal/cpu/gpu workers
x-nomad-base: &nomad-base
  restart: unless-stopped
  platform: linux/amd64
  env_file:
    - ./.env
  depends_on:
    temporal:
      condition: service_healthy
    elastic:
      condition: service_healthy
    mongo:
      condition: service_healthy
  volumes:
    # Uncomment the following line to mount a local nomad.yaml into all NOMAD services:
    # - ./configs/nomad.yaml:/app/nomad.yaml
    - ./.volumes/fs:/app/.volumes/fs

# Base configuration for standard NOMAD services using the default nomad image (app and internal worker)
x-nomad-service: &nomad-service
  <<: *nomad-base
  image: *nomad-image

# Common healthcheck for NOMAD internal/cpu/gpu workers
x-worker-healthcheck: &worker-healthcheck
  test:
    - "CMD"
    - "curl"
    - "--fail"
    - "--silent"
    - "http://localhost:8080/health"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# Common database environment variables for Temporal
x-temporal-db-env: &temporal-db-env
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-temporal}
  POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
  POSTGRES_SEEDS: postgresql

# Base configuration for Temporal admin tools tasks
x-temporal-admin: &temporal-admin
  image: *temporal-admin-image
  volumes:
    - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
  entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]

services:
  # keycloak:
  #   restart: unless-stopped
