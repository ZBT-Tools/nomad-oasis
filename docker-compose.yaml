  # broker for celery
  rabbitmq:
    restart: unless-stopped
    image: docker.io/rabbitmq:3.11.5-alpine
    container_name: nomad_oasis_rabbitmq
    environment:
      - RABBITMQ_ERLANG_COOKIE=SWQOKODSQALRPCLNMEQG
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=rabbitmq
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--silent", "--quiet", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # the search engine
  elastic:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: nomad_oasis_elastic_9
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://elastic:9200/_cat/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # the user data db
  mongo:
    restart: unless-stopped
    image: docker.io/mongo:8.0
    container_name: nomad_oasis_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null # --quiet
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "mongo:27017/test"
        - "--quiet"
        - "--eval"
        - "'db.runCommand({ping:1}).ok'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # the temporal persistence db
  postgresql:
    restart: unless-stopped
    container_name: nomad_oasis_postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    image: docker.io/postgres:16
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # one-off job that creates the temporal db schema
  temporal-setup-db:
    <<: *temporal-admin
    container_name: temporal-setup-db
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      <<: *temporal-db-env
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    command: ["setup_db"]

  # one-off job that registers the default temporal namespace
  temporal-create-namespace:
    <<: *temporal-admin
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    command: ["create_namespace"]

  # the workflow orchestration server
  temporal:
    restart: unless-stopped
    image: *temporal-server-image
    container_name: nomad_oasis_temporal
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-setup-db:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/_temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # nomad worker (processing)
  worker:
    restart: unless-stopped
    #image: ghcr.io/zbt-tools/nomad-oasis:main
    image: ghcr.io/zbt-tools/nomad-oasis-for-plugin-test:for_plugin_test
    platform: linux/amd64
    environment:
      <<: *nomad-environment
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_RABBITMQ_HOST: rabbitmq
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_LOGSTASH_HOST: logtransfer
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml
      - /media/daten/nomad-oasis/.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run action-internal-worker
    healthcheck:
      # See https://keithtenzer.com/temporal/Deploying_Temporal_Worker_on_Kubernetes/#liveliness-and-readiness-probes
      # for rationale on using 'ls /' as a liveness/readiness probe for Temporal workers.
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8080/health"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "4.0" # Maximum 4 CPU cores
          memory: 8G # Maximum 8GB RAM
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 15
        window: 1800s

  ## nomad gpu worker (actions)
  # gpu_worker:
  #   restart: unless-stopped
  #   image: ghcr.io/hussainarif12/nomad-oasis/gpu-action:main
  #   platform: linux/amd64
  #   container_name: nomad_oasis_gpu_worker
  #   environment:
  #     <<: *nomad-environment
  #     NOMAD_SERVICE: nomad_oasis_gpu_worker
  #   command: python -m nomad.cli admin run action-gpu-worker
  #   healthcheck: *worker-healthcheck
  #   deploy:
  #     replicas: 1
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all # Use all available GPUs
  #             capabilities: [gpu]
  #   environment:
  #     NOMAD_SERVICE: nomad_oasis_gpu_worker
  #     NOMAD_RABBITMQ_HOST: rabbitmq
  #     NOMAD_ELASTIC_HOST: elastic
  #     NOMAD_MONGO_HOST: mongo
  #     NOMAD_LOGSTASH_HOST: logtransfer
  #     NOMAD_TEMPORAL_HOST: temporal
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     elastic:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     temporal:
  #       condition: service_healthy
  #   volumes:
  #     # - ./configs/nomad.yaml:/app/nomad.yaml
  #     - ./.volumes/fs:/app/.volumes/fs
  #   command: python -m nomad.cli admin run action-gpu-worker
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "curl"
  #       - "--fail"
  #       - "--silent"
  #       - "http://localhost:8080/health"
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s

  # nomad cpu worker (actions)
  # cpu_worker:
  #   <<: *nomad-base
  #   image: *cpu-worker-image
  #   container_name: nomad_oasis_cpu_worker
  #   environment:
  #     <<: *nomad-environment
  #     NOMAD_SERVICE: nomad_oasis_cpu_worker
  #     NOMAD_RABBITMQ_HOST: rabbitmq
  #     NOMAD_ELASTIC_HOST: elastic
  #     NOMAD_MONGO_HOST: mongo
  #     NOMAD_LOGSTASH_HOST: logtransfer
  #     NOMAD_TEMPORAL_HOST: temporal
  #   deploy:
  #     replicas: 1
  #     resources:
  #       limits:
  #         cpus: "2.0" # Maximum 2 CPU cores
  #         memory: 8G # Maximum 8GB RAM
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     elastic:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     temporal:
  #       condition: service_healthy
  #   volumes:
  #     # - ./configs/nomad.yaml:/app/nomad.yaml
  #     - ./.volumes/fs:/app/.volumes/fs
  #   command: python -m nomad.cli admin run action-cpu-worker
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "curl"
  #       - "--fail"
  #       - "--silent"
  #       - "http://localhost:8080/health"
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s

  # nomad app (api + proxy)
  app:
    restart: unless-stopped
    # image: ghcr.io/zbt-tools/nomad-oasis:main
    image: ghcr.io/zbt-tools/nomad-oasis-for-plugin-test:for_plugin_test
    platform: linux/amd64
    container_name: nomad_oasis_app
    environment:
      <<: *nomad-environment
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 1080
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_RABBITMQ_HOST: rabbitmq
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_LOGSTASH_HOST: logtransfer
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_TEMPORAL_HOST: temporal
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elastic:
        condition: service_healthy
      north:
        condition: service_started
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml
      - /media/daten/nomad-oasis/.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 2
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8000/-/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad remote tools hub (JupyterHUB)
  north:
    restart: unless-stopped
    image: ghcr.io/zbt-tools/nomad-oasis-for-plugin-test:for_plugin_test
    platform: linux/amd64
    container_name: nomad_oasis_north
    environment:
      NOMAD_API_URL: "http://app:8000/backend/api/v1"
      BASE_URL: "/backend/north/"
      OAUTH_CALLBACK_URL: "http://localhost/backend/north/hub/oauth_callback"
      DOCKER_PREFIX: "nomad-oasis-north"
      DOCKER_NETWORK: "nomad_oasis_network"
    env_file:
      - ./.env.north
    volumes:
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "nomad_north:/data"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8081/backend/north/hub/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad logtransfer
  # to enable the logtransfer service run "docker compose --profile with_logtransfer up"
  logtransfer:
    restart: unless-stopped
    # image: ghcr.io/zbt-tools/nomad-oasis:main
    image: ghcr.io/zbt-tools/nomad-oasis-for-plugin-test:for_plugin_test
    platform: linux/amd64
    container_name: nomad_oasis_logtransfer
    environment:
      NOMAD_SERVICE: nomad_oasis_logtransfer
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
    env_file:
      - ./.env
    depends_on:
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml
      - /media/daten/nomad-oasis/.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run logtransfer
    profiles: ["with_logtransfer"]

  # nomad proxy (a reverse proxy for nomad)
  proxy:
    restart: unless-stopped
    image: docker.io/nginx:1.31.1-alpine
    container_name: nomad_oasis_proxy
    command: nginx -g 'daemon off;'
    volumes:
      # Shared config
      - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
      - ./configs/nginx_maps_conf:/etc/nginx/conf.d/nginx_maps_conf:ro
      # HTTP
      - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS (you need to have an SSL certificate)
      # - ./configs/nginx_https.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started # TODO: service_healthy
      north:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - 1080:1080
#      - 443:443

  # jupyterlab image: (this is only used to pull the image, no service is run for this)
  jupyterlab_image:
    # image: ghcr.io/zbt-tools/nomad-oasis/jupyter:main
    image: ghcr.io/zbt-tools/nomad-oasis-for-plugin-test/jupyter:for_plugin_test
    platform: linux/amd64
    container_name: nomad_jupyter_image
    pull_policy: always
    entrypoint: ["true"]
    deploy:
      replicas: 0 # Ensures the service isn't started

volumes:
  mongo:
    name: "nomad_oasis_mongo"
  elastic:
    name: "nomad_oasis_elastic"
  rabbitmq:
    name: "nomad_oasis_rabbitmq"
  keycloak:
    name: "nomad_oasis_keycloak"
  postgresql:
    name: "nomad_oasis_postgresql"
  nomad_north:
    name: "nomad_oasis_north"


networks:
  default:
    name: nomad_oasis_network
